name: Verify and publish All-In-One image
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: all-in-one-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build source-owned CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/felixludos/all-in-one:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/felixludos/all-in-one
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify API behavior in the built image
        env:
          IMAGE: ghcr.io/felixludos/all-in-one:${{ github.sha }}
        run: |
          docker run --rm --user 0 --entrypoint /bin/bash \
            -e ALLIN1_DEFAULT_DEVICE=cpu \
            -v "$PWD/tests:/tests:ro" "$IMAGE" -ec \
            'python3 -m pip install --no-cache-dir --target /tmp/test-deps pytest==8.3.5 && PYTHONPATH=/tmp/test-deps python3 -m pytest -q -p no:cacheprovider /tests/test_api.py'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and record immutable identity
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/felixludos/all-in-one:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' > manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          digest = json.loads(Path('manifest.json').read_text())['digest']
          image = os.environ['IMAGE'].rsplit(':', 1)[0] + '@' + digest
          release = {'image': image, 'source': 'https://github.com/felixludos/all-in-one',
                     'revision': os.environ['GITHUB_SHA'], 'version': '1.1.0',
                     'api_tests': 'passed', 'gpu_acceptance': 'required on target host'}
          Path('release.json').write_text(json.dumps(release, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Tested image: `' + image + '`\n\nGPU acceptance and ownership handover remain required in maity-infra.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: all-in-one-release
          path: release.json
          if-no-files-found: error
          retention-days: 30
